# Internal-only server for New Relic nginx monitoring (nri-nginx)
# Located in /etc/nginx/conf.d/ (NOT user_conf.d) so Certbot ignores 'localhost'
# Accessible only from localhost via port 8080 mapped in docker-compose
server {
    listen 8080;
    server_name localhost;

    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;  # Allow Docker container network probes (New Relic infrastructure agent)
        deny all;
    }

    # Deny everything else on this port
    location / {
        deny all;
    }
}
