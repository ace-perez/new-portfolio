services:
  portfolio:
    build: .
    container_name: new-portfolio
    restart: always
    environment:
      CERTBOT_EMAIL: aceleagueoflegends@gmail.com
      NGINX_SERVER_NAME: ace-perez-portfolio.dev
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - nginx_secrets:/etc/letsencrypt
      - nginx_certbot_www:/var/www/certbot
    depends_on:
      - api
    networks:
      - portfolio_net
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.5"

  api:
    build: ./api
    container_name: portfolio-api
    restart: always
    env_file:
      - ./api/.env
    environment:
      # Cap V8 heap so Node self-limits before Docker's OOM killer fires
      NODE_OPTIONS: "--max-old-space-size=384"
    volumes:
      - blog_data:/app/data
    expose:
      - "3001"
    networks:
      - portfolio_net
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"

  newrelic-infra:
    image: newrelic/infrastructure-bundle:latest
    container_name: newrelic-infra
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    network_mode: host
    pid: host
    cgroupns: host
    privileged: true
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./newrelic-integrations:/etc/newrelic-infra/integrations.d
    environment:
      NRIA_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NRIA_DISPLAY_NAME: "ace-perez-portfolio-ec2"
      # Required when running inside Docker with /:/host:ro mounted
      NRIA_OVERRIDE_HOST_ROOT: "/host"
      # Reduce agent log verbosity to save memory
      NRIA_LOG_LEVEL: "warn"
      # Scrape every 20s (60s can cause empty/broken chart rendering in NR UI)
      NRIA_METRICS_INTERVAL: "20"
    mem_limit: 256m
    mem_reservation: 128m

networks:
  portfolio_net:
    driver: bridge

volumes:
  nginx_secrets:
  nginx_certbot_www:
  blog_data:
